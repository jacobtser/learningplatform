<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<style>
  .err-wrap{ min-height:100vh; display:flex; flex-direction:column; }
  .err-main{ flex:1; display:flex; align-items:center; padding:clamp(40px,8vw,90px) 0; }
  .err-grid{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:clamp(30px,5vw,70px); align-items:center; width:100%; }
  .err-code{
    font-family:var(--serif); font-weight:700; font-variation-settings:"opsz" 144;
    font-size:clamp(5rem,16vw,11rem); line-height:.9; color:var(--estuary-deep); letter-spacing:-.02em;
  }
  .err-title{
    font-family:var(--serif); font-weight:600; font-variation-settings:"opsz" 90;
    font-size:clamp(1.6rem,3.4vw,2.5rem); line-height:1.14; color:var(--estuary-deep); margin:18px 0 16px;
  }
  .err-bilingual{ display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 16px; margin-top:26px; padding-top:20px; border-top:var(--hairline); }
  .err-bilingual .dangme{ font-size:1.15rem; }
  .err-bilingual .rule{ width:34px; height:1px; background:var(--sunset-gold); align-self:center; }
  .err-logo{
    background:var(--white); border:var(--hairline-soft); border-radius:16px; padding:16px;
    box-shadow:var(--shadow-soft);
  }
  .err-logo img{ display:block; width:100%; border-radius:10px; }
  .err-logo figcaption{
    margin-top:12px; padding-top:10px; border-top:var(--hairline-soft); text-align:center;
    font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--clay);
  }
  @media (max-width: 820px){ .err-grid{ grid-template-columns:1fr; } .err-logo{ max-width:360px; } }
</style>
</head>
<body>

<main class="err-wrap" id="main">
  <div class="err-main">
    <div class="wrap err-grid">
      <div>
        <p class="eyebrow eyebrow--gold">Error 404 · Page not found</p>
        <p class="err-code">404</p>
        <h1 class="err-title">This page drifted downstream.</h1>
        <p class="lede">The link you followed no longer points anywhere — like a word that slipped out of the lexicon. Let&rsquo;s get you back to dry land.</p>

        <div class="btn-row" style="margin-top:30px;">
          <a class="btn btn--primary" href="index.html">Back to the pitch <span class="btn__arrow" aria-hidden="true">&rarr;</span></a>
          <a class="btn btn--ghost" href="apply.html">Application dossier</a>
        </div>

        <div class="err-bilingual" aria-label="A Dangme phrase and its English meaning">
          <span class="dangme" lang="ada">O ngɛ ha kɛɛ?</span>
          <span class="rule" aria-hidden="true"></span>
          <span><b>How are you?</b> — from the platform&rsquo;s own lexicon.</span>
        </div>
      </div>

      <figure class="err-logo">
        <img src="assets/img/logo.jpg" alt="Dangme Learning Platform logo" width="720" height="922">
        <figcaption>Dangme Learning Platform · Learn · Translate · Speak</figcaption>
      </figure>
    </div>
  </div>
</main>

<script src="assets/js/main.js" defer></script>
</body>
